<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Clock</title>
</head>
<body>
    <h1>Current Time</h1>
  <div id="time"></div>

  <script>
    function showTime() {
      let now = new Date().toLocaleTimeString();
      document.getElementById("time").innerText = now;
    }

    setInterval(showTime, 1000);
    showTime();
  </script>

</body>
</html>
